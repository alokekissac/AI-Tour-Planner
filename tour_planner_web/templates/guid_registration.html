{% include 'public_header.html' %}
<div style=" background:url('/static/images/fly.jpg') ; height: 300px; width: 100%;  background-position: center;background-size: cover;"  >
	</div>
<center>
<form method="post">
	<h3>New Tour  Guid</h3>
	<table class="table" style="width: 500px; height: 100px;">
		<tr>
			<th>First Name</th>
			<td><input type="text" name="fname" required value="" class="form-control"></td>
		</tr>
        <tr>
			<th>Last Name</th>
			<td><input type="text" name="lname" required value="" class="form-control"></td>
		</tr>
		<tr>
			<th>Place</th>
			<td><input type="text" name="place" required value="" class="form-control"></td>
		</tr>
		
		<tr>
			<th>Phone</th>
			<td><input type="text" name="phone" value="" pattern="[0-9]{10}" required title="number format"  class="form-control"></td>
			</tr>
		</tr>
		<tr>
			<th>Email</th>
					<td><input type="email" name="email" value="" required class="form-control" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" >
					</td>
		</tr>

        <tr>
            <th>Tour Place</th>
            <td><select name="place_id" id="" class="form-control">
                {% for i in data['view'] %}
                    <option value="{{i.place_id}}">{{i.place_name}}</option>
                {% endfor %}
            </select></td>
        </tr>


        <tr>
                <th>Latitude</th>
            <td><input type="text" name="lati"  class="form-control" id="lat" >
            <a class="btn btn-success" onclick="myFunction();"><b>View Map</b></a>
            </td>
            </tr>

            <tr>
                <th>Longitude</th>
                 <td ><br><input type="text" name="longi"  class="form-control" id="lon" ></td>
            </tr>

		<tr>
			<th>User Name</th>
			<td><input type="text" name="username" value="" required class="form-control"></td>
		</tr>
		<tr>
			<tr>
					<th>Password</th>
					<!-- <td><input type="Password" name="password" value="" id="password" class="form-control" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{5,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 5 or more characters" required> 
			</td -->

			<td><input type="Password" name="password" value="" id="password" class="form-control"   required> 
			</td>
		</tr>
		<tr>
				<tr>
					<td align="center" colspan="2"><input type="submit"  name="submit" value="Sign up" class="btn btn-outline-success" style="width: 150px;"></td>
				</tr>
		</tr>

		

	</table>
</form>
</center>

<tr>
	<div id="dvMap" style="width: 450px; height: 400px"></div>
</tr>


<script type="text/javascript" src="http://maps.googleapis.com/maps/api/js?key=AIzaSyD3MPnSnyWwNmpnVEFkaddVvy_GWtxSejs&sensor=false"></script>
    <script type="text/javascript">
        // window.onload = function () {
          function myFunction(){
            var mapOptions = {
                center: new google.maps.LatLng(9.9763482, 76.286272),
                zoom: 14,
                mapTypeId: google.maps.MapTypeId.ROADMAP
            };
            var infoWindow = new google.maps.InfoWindow();
            var latlngbounds = new google.maps.LatLngBounds();
            var map = new google.maps.Map(document.getElementById("dvMap"), mapOptions);
            google.maps.event.addListener(map, 'click', function (e) {
                alert("Latitude: " + e.latLng.lat() + "\r\nLongitude: " + e.latLng.lng());
              document.getElementById('lat').value = e.latLng.lat();
                document.getElementById('lon').value = e.latLng.lng();
           

            });
        }
    </script>
