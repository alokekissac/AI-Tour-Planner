<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Legal Chat Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #ddd;
        }

        .chat-box {
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            clear: both;
        }

        .message.sent {
            float: right;
            background-color: #128c7e;
            color: white;
        }

        .message.received {
            float: left;
            background-color: #e4e4e4;
            color: black;
        }

        .message-text {
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 70%;
            display: inline-block;
            position: relative;
        }

        .timestamp {
            display: block;
            font-size: 10px;
            color: gray;
            margin-top: 4px;
        }

        .chat-input {
            padding: 15px 20px;
            border-top: 1px solid #ddd;
        }

        .chat-input form {
            display: flex;
            align-items: center;
        }

        .chat-input input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }

        .chat-input input[type="submit"] {
            background-color: #128c7e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-left: 10px;
        }

        .chat-input input[type="submit"]:hover {
            background-color: #0d6e60;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Tour Chat Bot</div>

    <div class="chat-box" id="chatBox">
        {% for row in data['chatemp'] %}
            {% if row['sender_id']|string == data['lid']|string %}
                <div class="message sent">
                    <div class="message-text">
                        {{ row['message'] }}
                        <span class="timestamp">{{ row['chat_date'] }}</span>
                    </div>
                </div>
            {% else %}
                <div class="message received">
                    <div class="message-text">
                        {{ row['message'] }}
                        <span class="timestamp">{{ row['chat_date'] }}</span>
                    </div>
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <div class="chat-input">
        <form method="post">
            <input type="text" name="textfield" placeholder="Enter your tour question..." required>
            <input type="submit" name="submit" value="Send">
        </form>
    </div>
</div>

<!-- Auto-scroll to latest message -->
<script>
    window.onload = function () {
        const chatBox = document.getElementById('chatBox');
        chatBox.scrollTop = chatBox.scrollHeight;
    };
</script>

</body>
</html>
